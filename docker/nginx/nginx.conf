worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 20m;

    upstream tax_app {
        server app:3000;
    }

    # 同机 tax-bridge（GoFrame XYGo Admin），监听宿主机 4096
    upstream tax_bridge {
        server host.docker.internal:4096;
    }

    server {
        listen 80;
        server_name _;

        # 外网访问路径：http://<host>/tax_filing
        location = /tax_filing {
            proxy_pass http://tax_app/tax_filing;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /tax_filing/ {
            proxy_pass http://tax_app/tax_filing/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 300s;
        }

        # 兼容 HTML 中未带 /tax_filing 前缀的静态资源请求（basePath 构建异常时的兜底）
        location /_next/ {
            proxy_pass http://tax_app/tax_filing/_next/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
        }

        # 根路径回退到 tax-bridge；须先移除 iptables 80→4096 重定向，由本 Nginx 统一入口
        location / {
            proxy_pass http://tax_bridge;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
        }
    }
}
