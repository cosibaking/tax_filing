services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-opc_compliance}
      MYSQL_USER: ${MYSQL_USER:-tax_filing_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-password}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h localhost -u"$$MYSQL_USER" -p"$$MYSQL_PASSWORD" || exit 1']
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    restart: unless-stopped

  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_BASE_PATH: /tax_filing
    environment:
      DATABASE_URL: mysql://${MYSQL_USER:-tax_filing_app}:${MYSQL_PASSWORD:-password}@mysql:3306/${MYSQL_DATABASE:-opc_compliance}
      REDIS_URL: redis://redis:6379
      DEPLOY_MODE: ${DEPLOY_MODE:-prod}
      NEXT_PUBLIC_BASE_PATH: /tax_filing
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost/tax_filing}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      CRON_SECRET: ${CRON_SECRET}
      SMS_PROVIDER: ${SMS_PROVIDER:-mock}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      UPLOAD_DIR: /app/uploads
      COMPLIANCE_COST_RATIO_THRESHOLD: ${COMPLIANCE_COST_RATIO_THRESHOLD:-0.8}
      LEGAL_TERMS_VERSION: ${LEGAL_TERMS_VERSION:-1.0}
      LEGAL_PRIVACY_VERSION: ${LEGAL_PRIVACY_VERSION:-1.0}
      SEED_RANDOM_MEMBERS: ${SEED_RANDOM_MEMBERS:-8}
      SEED_RANDOM_PASSWORD: ${SEED_RANDOM_PASSWORD:-test123}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - uploads_data:/app/uploads
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/tax_filing/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - '${NGINX_HTTP_PORT:-80}:80'
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:
  uploads_data:
